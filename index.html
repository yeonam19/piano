<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="piano">
    <div class="controls">
      <button id="octave-down">◀ 옥타브</button>
      <span id="octave-display">옥타브: 3–4</span>
      <button id="octave-up">옥타브 ▶</button>
    </div>
    <div id="keyboard"></div>
    <div class="key-hint">키보드: A~J (1번째 옥타브) / K L ; ' (2번째 옥타브) / Z X (옥타브 이동)</div>
  </div>
  <script src="piano.js"></script>
</body>
</html>
