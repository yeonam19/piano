<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="piano">
    <div class="controls">
      <div class="controls-left">
        <select id="theme-select">
          <option value="classic">🎹 클래식</option>
          <option value="rainbow">🌈 무지개</option>
          <option value="kirby">⭐ 별의커비</option>
          <option value="chocolate">🍫 초콜릿</option>
          <option value="banana">🍌 바나나</option>
          <option value="space">🚀 우주</option>
          <option value="ocean">🌊 바다</option>
          <option value="sakura">🌸 벚꽃</option>
          <option value="neon">💜 네온</option>
        </select>
        <span class="controls-divider"></span>
        <select id="instrument-select">
          <option value="piano">🎹 피아노</option>
          <option value="epiano">🎹 일렉 피아노</option>
          <option value="organ">🎵 오르간</option>
          <option value="strings">🎻 현악기</option>
          <option value="synth">🎛️ 신스</option>
          <option value="bell">🔔 벨</option>
          <option value="guitar">🎸 기타</option>
          <option value="flute">🪈 플루트</option>
          <option value="drum">🥁 드럼</option>
        </select>
      </div>
    </div>

    <!-- 연습 모드 -->
    <div id="practice-panel">
      <div class="practice-header">
        <select id="song-select">
          <option value="">🎵 동요 연습</option>
          <option value="school-bell">학교종</option>
          <option value="butterfly">나비야</option>
          <option value="airplane">비행기</option>
          <option value="twinkle">반짝반짝 작은별</option>
          <option value="three-bears">곰 세 마리</option>
          <option value="mountain-rabbit">산토끼</option>
          <option value="spring-girl">봄나들이</option>
          <option value="alphabet">ABC송</option>
          <option value="head-shoulders">머리 어깨 무릎 발</option>
          <option value="elephant">코끼리 아저씨</option>
          <option value="frog">개구리</option>
          <option value="round-round">둥글게 둥글게</option>
          <option value="arirang">아리랑</option>
          <option value="chopsticks">젓가락 행진곡</option>
        </select>
        <button id="practice-start" disabled>▶ 시작</button>
        <button id="practice-stop" style="display:none">■ 그만</button>
        <span id="practice-score"></span>
      </div>
      <div id="note-display" style="display:none">
        <div id="note-track"></div>
      </div>
    </div>

    <div id="keyboard-viewport">
      <div id="keyboard"></div>
    </div>

    <!-- 네비게이션 미니맵 -->
    <div id="nav-bar">
      <div id="nav-track">
        <div id="nav-window"></div>
      </div>
      <div id="nav-labels"></div>
    </div>

    <div class="key-hint">키보드: A~J / W E T Y U (건반) · Z X (옥타브 이동)</div>
  </div>
  <script src="piano.js"></script>
</body>
</html>
