<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Web Piano</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="piano">
    <div class="controls">
      <div class="controls-left">
        <select id="instrument-select">
          <option value="piano">🎹 피아노</option>
          <option value="epiano">🎹 일렉 피아노</option>
          <option value="organ">🎵 오르간</option>
          <option value="strings">🎻 현악기</option>
          <option value="synth">🎛️ 신스</option>
          <option value="bell">🔔 벨</option>
          <option value="guitar">🎸 기타</option>
          <option value="flute">🪈 플루트</option>
        </select>
        <span class="controls-divider"></span>
        <button id="octave-down">◀ 옥타브</button>
        <span id="octave-display">옥타브: 3–4</span>
        <button id="octave-up">옥타브 ▶</button>
      </div>
      <button id="mode-toggle">🔀 드래그 모드</button>
    </div>
    <div id="keyboard-viewport">
      <div id="keyboard"></div>
    </div>
    <div class="key-hint">키보드: A~J (1번째 옥타브) / K L ; ' (2번째 옥타브) / Z X (옥타브 이동)</div>
  </div>
  <script src="piano.js"></script>
</body>
</html>
